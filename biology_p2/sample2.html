      function initDatabase() {
        return new Promise((resolve, reject) => {
          const r = indexedDB.open(DB_NAME, DB_VERSION);
          r.onerror = () => reject(r.error);
          r.onsuccess = () => {
            db = r.result;
            resolve(db);
          };
          r.onupgradeneeded = (e) => {
            if (!e.target.result.objectStoreNames.contains(PROGRESS_STORE))
              e.target.result.createObjectStore(PROGRESS_STORE, {
                keyPath: "id",
              });
          };
        });
      }
      async function saveProgress() {
        if (!db) await initDatabase();
        const tx = db.transaction([PROGRESS_STORE], "readwrite");
        tx.objectStore(PROGRESS_STORE).put({
          id: "current",
          answers: userAnswers,
          timeRemaining: timeSeconds,
          timestamp: new Date().toISOString(),
        });
      }
      async function loadProgress() {
        if (!db) await initDatabase();
        return new Promise((resolve) => {
          const req = db
            .transaction([PROGRESS_STORE], "readonly")
            .objectStore(PROGRESS_STORE)
            .get("current");
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      }

      async function callDEEPSEEKForMark(
        question,
        studentAnswer,
        markScheme,
        maxMarks,
      ) {
        if (!DEEPSEEK_API_KEY || DEEPSEEK_API_KEY === "YOUR_DEEPSEEK_API_KEY") {
          if (!studentAnswer)
            return { score: 0, feedback: "No answer provided" };
          let keywords = question.correctKeywords || [];
          if (keywords.length === 0)
            return { score: 0, feedback: "No keywords defined for marking" };
          let ansLower = studentAnswer.toLowerCase();
          let matched = keywords.filter((kw) =>
            ansLower.includes(kw.toLowerCase()),
          ).length;
          let required = question.requiredKeywords || keywords.length;
          let score = Math.min(matched, required, maxMarks);
          let feedback = `Matched ${matched}/${required} key terms. Expected: ${keywords.join(", ")}`;
          return { score: score, feedback: feedback };
        }

        const prompt = `You are an Edexcel IGCSE Biology examiner. Award marks strictly based on the mark scheme and provide constructive feedback.
    Question: "${question.text}"
    Mark Scheme: "${markScheme}"
    Maximum marks: ${maxMarks}
    Student Answer: "${studentAnswer || "[no answer]"}"
    Return ONLY a JSON object: {"score": number (0-${maxMarks}), "feedback": "brief constructive feedback explaining what was good/missing"}. Do not include any other text.`;

        try {
          const response = await fetch(
            "https://api.DEEPSEEK.com/v1/chat/completions",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${DEEPSEEK_API_KEY}`,
              },
              body: JSON.stringify({
                model: DEEPSEEK_MODEL,
                messages: [{ role: "user", content: prompt }],
                temperature: 0.1,
              }),
            },
          );
          if (!response.ok) throw new Error(`API error ${response.status}`);
          const data = await response.json();
          const result = JSON.parse(data.choices[0].message.content);
          return {
            score: Math.min(Math.max(0, parseInt(result.score) || 0), maxMarks),
            feedback: result.feedback || "Smart assessment complete.",
          };
        } catch (e) {
          console.error("DEEPSEEK error:", e);
          return {
            score: 0,
            feedback: "Smart marking error - please review manually",
          };
        }
      }

        ) {

            "Google Script URL not configured. Falling back to download.",

          return false;

        try {
          const formData = new URLSearchParams();
          formData.append("recipient", recipientEmail);
          formData.append("subject", `Exam Results: ${EXAM_META.title}`);
          formData.append("htmlBody", htmlContent);

          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "cors", // still cors, but now simple request
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: formData.toString(),
          });
          if (response.ok) {
            showToast(`✅ Results emailed to ${recipientEmail}`, false);
            return true;
          } else {
            throw new Error(`HTTP ${response.status}`);

          console.error("Email send failed:", err);
          showToast(
            "⚠️ Email failed – results will be downloaded instead.",
            true,
          );
          return false;
        }

      async function submitAndMarkExam() {
        if (examSubmitted) return;
        clearInterval(timerInterval);
        clearInterval(autoSaveInterval);
        examSubmitted = true;
        showToast("🤖 Marking in progress...", false);
        const loading = document.createElement("div");
        loading.className = "loading-overlay";
        loading.innerHTML = `<div class="loading-spinner"><div class="spinner"></div><p>AI marking using mark scheme...</p></div>`;
        document.body.appendChild(loading);
        let totalEarned = 0,
          totalPossible = 0;
        let feedbackItems = [];
        for (let i = 0; i < actualQuestions.length; i++) {
          const q = actualQuestions[i];
          totalPossible += q.marks;
          const ans = userAnswers[i] || "";
          let result =
            ans.trim().length > 15
              ? await callDEEPSEEKForMark(i + 1, q.text, ans, q.marks, q.msText)
              : {
                  earned: 0,
                  feedback:
                    "Answer too short or missing. Refer to mark scheme.",
                  tips: "Provide detailed biological explanation.",
                };
          totalEarned += result.earned;
          feedbackItems.push({
            num: i + 1,
            topic: q.topic || `Q${i + 1}`,
            answerExcerpt: ans,
            earned: result.earned,
            max: q.marks,
            feedback: result.feedback,
            tips: result.tips,
            msRef: q.msText,
          });
        }
        let percent = (totalEarned / totalPossible) * 100;
        let grade =
          percent >= 85
            ? "9"
            : percent >= 78
              ? "8"
              : percent >= 70
                ? "7"
                : percent >= 62
                  ? "6"
                  : percent >= 54
                    ? "5"
                    : percent >= 45
                      ? "4"
                      : percent >= 35
                        ? "3"
                        : "U";
        let reviewHtml = `<h2>✨ Biology Paper 2B Results</h2><div class="score-badge">${totalEarned} / ${totalPossible} (${percent.toFixed(1)}%)</div><div class="grade-box"><strong>🎓 Predicted Grade (9-1): ${grade}</strong> (aligned to Edexcel MS)</div><div><h3>📌 Detailed Feedback & Grade 9 Pointers</h3>`;
        for (let fb of feedbackItems) {
          reviewHtml += `<div class="feedback-card"><div class="feedback-header"><span>Q${fb.num}: ${fb.topic}</span><span class="mark-badge">${fb.earned}/${fb.max}</span></div><div><strong>📝 Your answer:</strong><br><div style="white-space:pre-wrap;">${(fb.answerExcerpt || "---").substring(0, 600)}</div></div><div><strong>🤖 Feedback:</strong><br>${fb.feedback}</div><div class="ai-tips"><strong>🌟 Grade 9 Tips:</strong><br>${fb.tips}</div><div style="margin-top:12px; font-size:0.85rem; background:#f0f4fa; padding:8px; border-radius:12px;"><strong>📖 Mark scheme reference:</strong><br>${fb.msRef.substring(0, 350)}</div></div>`;
        }
        reviewHtml += `<div class="weakness-box" style="background:#eef2fa; padding:16px; border-radius:20px;"><h3>🎯 What to improve for Grade 9</h3><ul><li>Use precise biological terms (e.g., osmosis, diffusion, mutualism, transpiration).</li><li>Always reference data/graphs when evaluating conclusions.</li><li>Link structure to function (alveoli, villi, nephron).</li><li>Apply mark scheme command words: describe, explain, evaluate, calculate.</li></ul><p>✅ This marking follows Pearson Edexcel IGCSE Biology 4BI1 mark scheme (June 2019).</p></div>`;
        document.getElementById("reviewPanel").classList.remove("hidden");
        document.getElementById("reviewPanel").innerHTML = reviewHtml;
        document.body.removeChild(loading);

          if (el.id !== "submitBtn") el.disabled = true;
        });

            "Enter your email address to receive detailed results (or cancel to download):",

            downloadAsHTML(emailHtml);
            showToast("No valid email provided. Results downloaded.", false);
            return;
          }

        const emailSent = await sendResultsViaGoogleScript(
          recipient,
          emailHtml,
          "",
        );
      }
      function removeEmojis(text) {
        const emojisToRemove = [
          "📖",
          "✨",
          "🎓",
          "📝",
          "🤖",
          "🌟",
          "📌",
          "✅",
          "📘",
          "✍️",
          "📩",
          "📰",
          "⏱️",
          "🧠",
          "📂",
          "🔍",
          "◀",
          "▶",
          "📀",
          "🎯",
          "💡",
          "🔔",
          "⚠️",
          "❌",
        ];
        let result = text;
        for (const emoji of emojisToRemove) {
          result = result.split(emoji).join("");
        }
        return result;
      }

          saved.answers &&
          saved.answers.length === actualQuestions.length &&
          confirm("Resume previous exam progress?")
        ) {
          userAnswers = saved.answers;
          timeSeconds = saved.timeRemaining || timeSeconds;
        }
        buildQuestions();
        renderNavigation();
        updateTimerDisplay();
        timerInterval = setInterval(() => {
          if (!examSubmitted && timeSeconds > 0) {
            timeSeconds--;
            updateTimerDisplay();
          } else if (timeSeconds <= 0 && !examSubmitted) autoSubmit();
        }, 1000);
        autoSaveInterval = setInterval(saveProgress, 30000);
        document.getElementById("nextBtn").onclick = () => {
          if (currentQIndex + 1 < actualQuestions.length && !examSubmitted)
            goToQuestion(currentQIndex + 1);
        };
        document.getElementById("prevBtn").onclick = () => {
          if (currentQIndex - 1 >= 0 && !examSubmitted)
            goToQuestion(currentQIndex - 1);
        };
        document.getElementById("submitBtn").onclick = () =>
          submitAndMarkExam();
      };
