      async function callDEEPSEEKForMark(
        question,
        studentAnswer,
        markScheme,
        maxMarks,
      ) {
        if (!DEEPSEEK_API_KEY || DEEPSEEK_API_KEY === "YOUR_DEEPSEEK_API_KEY") {
          if (!studentAnswer)
            return { score: 0, feedback: "No answer provided" };
          let keywords = question.correctKeywords || [];
          if (keywords.length === 0)
            return { score: 0, feedback: "No keywords defined" };
          let ansLower = studentAnswer.toLowerCase();
          let matched = keywords.filter((kw) =>
            ansLower.includes(kw.toLowerCase()),
          ).length;
          let required = question.requiredKeywords || keywords.length;
          let score = Math.min(matched, required, maxMarks);
          return {
            score,
            feedback: `Matched ${matched}/${required} key terms. Expected: ${keywords.join(", ")}`,
          };
        }
        const prompt = `You are an Edexcel IGCSE Biology examiner. Award marks strictly based on mark scheme. Question: "${question.text}" Mark Scheme: "${markScheme}" Max marks: ${maxMarks} Student Answer: "${studentAnswer || "[no answer]"}" Return ONLY JSON: {"score": number (0-${maxMarks}), "feedback": "brief feedback"}`;
        try {
          const response = await fetch(
            "https://api.DEEPSEEK.com/v1/chat/completions",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${DEEPSEEK_API_KEY}`,
              },
              body: JSON.stringify({
                model: DEEPSEEK_MODEL,
                messages: [{ role: "user", content: prompt }],
                temperature: 0.1,
              }),
            },
          );
          if (!response.ok) throw new Error(`API error ${response.status}`);
          const data = await response.json();
          const result = JSON.parse(data.choices[0].message.content);
          return {
            score: Math.min(Math.max(0, parseInt(result.score) || 0), maxMarks),
            feedback: result.feedback || "Smart assessment complete.",
          };
        } catch (e) {
          console.error("DEEPSEEK error:", e);
          return {
            score: 0,
            feedback: "Smart marking error - please review manually",
          };
        }
      }

      async function submitAndMarkExam() {
        if (examSubmitted) return;
        clearInterval(timerInterval);
        if (autoSaveTimer) clearInterval(autoSaveTimer);
        examSubmitted = true;
        showToast("🤖 Smart marking...", false);
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "loading-overlay";
        loadingDiv.innerHTML = `<div class="loading-spinner"><div class="spinner"></div><p>Marking in progress...</div>`;
        document.body.appendChild(loadingDiv);
        let totalEarned = 0,
          totalPossible = 0;
        let questionFeedback = [];
        for (let i = 0; i < questionsData.length; i++) {
          let q = questionsData[i];
          let answer = userAnswers[i] || "";
          let earned = 0;
          let aiFeedback = "";
          if (q.isGraphical === true) {
            earned =
              userManualMarks[i] !== null && !isNaN(userManualMarks[i])
                ? userManualMarks[i]
                : 0;
            earned = Math.min(Math.max(0, earned), q.marks);
            aiFeedback =
              "Self-assessed by student (graph/diagram - compared with mark scheme)";
          } else if (q.type === "mcq") {
            let studentLetter = (answer || "").trim().toLowerCase().charAt(0);
            let correctOptionLetter = (q.correct || "").trim().toLowerCase();
            if (studentLetter === correctOptionLetter) earned = q.marks;
            else earned = 0;
            let correctFullText = "";
            if (q.options)
              for (let opt of q.options)
                if (opt.toLowerCase().startsWith(correctOptionLetter)) {
                  correctFullText = opt;
                  break;
                }
            aiFeedback =
              earned === q.marks
                ? `Correct answer: ${q.correct}`
                : `Incorrect. Correct answer is ${q.correct}${correctFullText ? ": " + correctFullText : ""}. Your answer: ${answer || "none"}`;
          } else {
            const aiResult = await callDEEPSEEKForMark(
              q,
              answer,
              q.msText,
              q.marks,
            );
            earned = aiResult.score;
            aiFeedback = aiResult.feedback;
          }
          totalEarned += earned;
          totalPossible += q.marks;
          let status =
            earned === q.marks
              ? "✓ Full marks"
              : earned === 0
                ? "✗ No marks"
                : "⚠ Partial marks";
          questionFeedback.push({
            number: i + 1,
            topic: q.topic,
            questionText: q.text,
            studentAnswer: answer || "(blank)",
            marksEarned: earned,
            marksTotal: q.marks,
            status,
            expectedAnswer: q.msText,
            aiFeedback,
            isGraphical: q.isGraphical,
          });
        }
        let percent = (totalEarned / totalPossible) * 100;
        let grade =
          percent >= 85
            ? "9"
            : percent >= 78
              ? "8"
              : percent >= 70
                ? "7"
                : percent >= 62
                  ? "6"
                  : percent >= 54
                    ? "5"
                    : percent >= 45
                      ? "4"
                      : percent >= 35
                        ? "3"
                        : percent >= 25
                          ? "2"
                          : "1";
        let weakTopics = [];
        let topicAgg = {};
        questionFeedback.forEach((fb) => {
          if (!topicAgg[fb.topic]) topicAgg[fb.topic] = { earned: 0, total: 0 };
          topicAgg[fb.topic].earned += fb.marksEarned;
          topicAgg[fb.topic].total += fb.marksTotal;
        });
        for (let t in topicAgg)
          if ((topicAgg[t].earned / topicAgg[t].total) * 100 < 55)
            weakTopics.push(t);
        const reviewDiv = document.getElementById("reviewPanel");
        reviewDiv.classList.remove("hidden");
        let html = `<h2>📊 Exam Results</h2><div class="score-badge">${totalEarned} / ${totalPossible} (${percent.toFixed(1)}%)</div><div class="grade-box"><strong>Grade: ${grade}</strong></div><div class="grade-box" style="background:#e9f0f5;"><strong>📊 Graph Questions:</strong> ${graphQuestionCount} question(s) were self-assessed using mark scheme</div>`;
        if (weakTopics.length)
          html += `<div class="weakness-box"><h3>⚠️ Weak areas (&lt;55%)</h3><ul>${weakTopics.map((w) => `<li>${w}</li>`).join("")}</ul></div>`;
        else
          html += `<div class="weakness-box" style="background:#e0f2e9;"><h3>✅ Strong performance overall!</h3></div>`;
        html += `<details open><summary>📋 Detailed Feedback</summary><table class="feedback-table"><thead><tr><th>#</th><th>Topic</th><th>Question</th><th>Your Answer</th><th>Score</th><th>Feedback</th><th>Mark Scheme</th></tr></thead><tbody>`;
        for (let fb of questionFeedback) {
          let cls =
            fb.marksEarned === fb.marksTotal
              ? "correct-highlight"
              : fb.marksEarned === 0
                ? "incorrect-highlight"
                : "";
          html += `<tr class="${cls}"><td>${fb.number}${fb.isGraphical ? " 📊" : ""}</td><td>${fb.topic}</td><td>${fb.questionText}</td><td style="max-width:250px;">${fb.studentAnswer}</td><td style="text-align:center;">${fb.marksEarned}/${fb.marksTotal}<br>${fb.status}</td><td style="max-width:300px;">${fb.aiFeedback || "No feedback"}</td><td style="max-width:250px;">${fb.expectedAnswer || "N/A"}</td></tr>`;
        }
        html += `</tbody></table></details><p style="margin-top: 20px; padding: 12px; background: #f0f6fa; border-radius: 16px;">✅ <strong>How marking worked:</strong> Graph/drawing questions (${graphQuestionCount}) were self-assessed. All others marked automatically.</p>`;
        reviewDiv.innerHTML = html;
        document.body.removeChild(loadingDiv);
        document
          .querySelectorAll("input, textarea, button, select")
          .forEach((el) => {
            if (el.id !== "submitBtn") el.disabled = true;
          });
        document.getElementById("submitBtn").disabled = true;
        showToast("Marking complete!", false);
        localStorage.removeItem("igcse_bio_exam_autosave");
        try {
          const emailData = {
            score: totalEarned,
            totalMarks: totalPossible,
            percent,
            grade,
            weakTopics,
            details: questionFeedback.map((fb) => ({
              qNum: fb.number,
              topic: fb.topic,
              questionText: fb.questionText,
              studentAnswer: fb.studentAnswer,
              earned: fb.marksEarned,
              max: fb.marksTotal,
              aiFeedback: fb.aiFeedback,
              expectedAnswer: fb.expectedAnswer,
              isGraphical: fb.isGraphical,
            })),
          };
          await sendResultsEmail(emailData, "Exam Candidate");
        } catch (e) {
          console.error("Email sending failed:", e);
        }
      }

      window.saveAnswer = saveAnswer;
      window.setManualMark = setManualMark;
      window.toggleMarkScheme = toggleMarkScheme;
      window.goToQuestion = goToQuestion;
      window.handleTextareaInput = handleTextareaInput;

      window.onload = () => {
        loadAutoSave();
        buildQuestionsHTML();
        renderNavigation();
        startTimer();
        autoSaveTimer = setInterval(() => {
          if (!examSubmitted) autoSaveToLocal();
        }, 30000);
        document.getElementById("nextBtn").onclick = () => {
          if (currentQIndex + 1 < questionsData.length && !examSubmitted)
            goToQuestion(currentQIndex + 1);
        };
        document.getElementById("prevBtn").onclick = () => {
          if (currentQIndex - 1 >= 0 && !examSubmitted)
            goToQuestion(currentQIndex - 1);
        };
        document.getElementById("submitBtn").onclick = () => {
          if (
            confirm(
              "Submit exam? Graph questions require self-assessment; other questions will be Smart-marked.",
            )
          )
            submitAndMarkExam();
        };
      };
    </script>
  </body>
</html>
