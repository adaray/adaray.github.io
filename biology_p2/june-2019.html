      function initDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => {
            db = request.result;
            resolve(db);
          };
          request.onupgradeneeded = (event) => {
            const dbEvent = event.target.result;
            if (!dbEvent.objectStoreNames.contains(PROGRESS_STORE))
              dbEvent.createObjectStore(PROGRESS_STORE, { keyPath: "id" });
          };
        });
      }
      async function saveProgressToDB(
        answers,
        timeLeft,
        transactionalStateMap,
      ) {
        if (!db) await initDatabase();
        return new Promise((resolve, reject) => {
          const tx = db.transaction([PROGRESS_STORE], "readwrite");
          const store = tx.objectStore(PROGRESS_STORE);
          store.put({
            id: "current_progress",
            answers: answers,
            timeRemaining: timeLeft,
            transactionalState: transactionalStateMap,
            timestamp: new Date().toISOString(),
          });
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      }
      async function loadProgressFromDB() {
        if (!db) await initDatabase();
        return new Promise((resolve, reject) => {
          const tx = db.transaction([PROGRESS_STORE], "readonly");
          const store = tx.objectStore(PROGRESS_STORE);
          const req = store.get("current_progress");
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });

      async function getAIFeedback(
        questionNum,
        questionText,
        studentAnswer,
        maxMarks,
        markSchemeRef,
        isTransactional = false,
        choiceType = null,
      ) {
        if (
          !USE_AI_MARKING ||
          !DEEPSEEK_API_KEY ||
          DEEPSEEK_API_KEY === "your-deepseek-api-key-here"
        ) {
          return {
            earned: 0,
            feedback: "⚠️ DeepSeek API key missing. Smart marking disabled.",
            tips: "Set valid DEEPSEEK_API_KEY.",
            level: "Not marked",
          };
        }
        const systemPrompt = `You are an examiner. Provide a mark (out of ${maxMarks}) and detailed feedback with mark scheme reference. Give 3-5 actionable 'Grade 9 Tips'. Return JSON: { "earned": number, "feedback": "string", "tips": "string" }`;
        let userPrompt = `Question ${questionNum}: ${questionText}\nMark scheme: ${markSchemeRef}\nStudent answer: """${studentAnswer.substring(0, 3500)}"""\n${isTransactional ? `Transactional writing (${choiceType === "letter" ? "letter" : "article"}). Evaluate form, register, organisation, accuracy.` : "Assess using standard criteria."}`;
        try {
          const response = await fetch(
            "https://api.deepseek.com/v1/chat/completions",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${DEEPSEEK_API_KEY}`,
              },
              body: JSON.stringify({
                model: DEEPSEEK_MODEL,
                messages: [
                  { role: "system", content: systemPrompt },
                  { role: "user", content: userPrompt },
                ],
                temperature: 0.2,
                response_format: { type: "json_object" },
              }),
            },
          );
          if (!response.ok) throw new Error(`API error ${response.status}`);
          const data = await response.json();
          const result = JSON.parse(data.choices[0].message.content);
          let earned = Math.min(
            maxMarks,
            Math.max(0, Math.round(result.earned)),
          );
          if (isNaN(earned)) earned = Math.floor(maxMarks * 0.6);
          return {
            earned,
            feedback: result.feedback || "Smart feedback.",
            tips:
              result.tips ||
              "Analyse writer's methods, embed quotations, compare explicitly.",
            level: "Smart Marked",
          };
        } catch (err) {
          console.error(err);
          return {
            earned: Math.floor(maxMarks * 0.5),
            feedback: `Smart marking error: ${err.message}. Partial score.`,
            tips: "Review mark scheme manually.",
            level: "Fallback",
          };
        }
      }

            };
            answerText = tdata.content;
            if (tdata.choice && tdata.content.trim().length > 80) {
              const choiceLabel =
                tdata.choice === "letter" ? "Letter" : "Article";
              result = await getAIFeedback(
                i + 1,
                `Transactional: ${choiceLabel} - ${q.text}`,
                tdata.content,
                q.marks,
                q.msText,
                true,
                tdata.choice,
              );
            } else if (tdata.content.trim().length > 20) {
              result = {
                earned: Math.min(15, Math.floor(tdata.content.length / 15)),
                feedback: "Partial response. Develop full letter/article.",
                tips: "Write 300+ words with clear structure.",
                level: "Partial",
              };
            } else {
              result = {
                earned: 0,
                feedback: "No substantial transactional response.",
                tips: "Select an option and write a developed response.",
              };
            }
          } else {
            answerText = userAnswers[i] || "";
            if (answerText.trim().length > 15) {
              result = await getAIFeedback(
                i + 1,
                q.text,
                answerText,
                q.marks,
                q.msText,
                false,
              );
            } else {
              result = {
                earned: 0,
                feedback:
                  "❌ Answer too short or missing. Refer to mark scheme.",
                tips: "Provide detailed analysis with textual references.",
              };
            }
          }
          totalEarned += result.earned;
          feedbackItems.push({
            num: i + 1,
            topic: q.topic || `Question ${i + 1}`,
            answerExcerpt: answerText,
            earned: result.earned,
            max: q.marks,
            feedback: result.feedback,
            tips: result.tips,
            markSchemeRef: q.msText,
          });
        }

        let percent = (totalEarned / totalPossible) * 100;
        let grade =
          percent >= 85
            ? "9"
            : percent >= 78
              ? "8"
              : percent >= 70
                ? "7"
                : percent >= 62
                  ? "6"
                  : percent >= 54
                    ? "5"
                    : percent >= 45
                      ? "4"
                      : percent >= 35
                        ? "3"
                        : "U";

        // Build the same HTML for on‑screen display, now including mark scheme reference (as originally)
        let reviewHtml = `<h2>✨ Results | ${EXAM_META.title}: ${EXAM_META.dateInfo}</h2>
        <div class="score-badge">${totalEarned} / ${totalPossible} (${percent.toFixed(1)}%)</div>
        <div class="grade-box"><strong>🎓 Predicted Grade (9-1): ${grade}</strong> (based on mark scheme alignment)</div>
        <div><h3>📌 Detailed Feedback & Grade 9 Pointers</h3>`;
        for (let fb of feedbackItems) {
          reviewHtml += `<div class="feedback-card">
                <div class="feedback-header"><span>Q${fb.num}: ${fb.topic}</span><span class="mark-badge">${fb.earned}/${fb.max}</span></div>
                <div><strong>📝 Your answer (full):</strong><br><div style="white-space:pre-wrap;">${(fb.answerExcerpt || "---").replace(/</g, "&lt;")}</div></div>
                <div><strong>🤖 Feedback:</strong><br>${fb.feedback.replace(/\n/g, "<br>")}</div>
                <div class="ai-tips"><strong>🌟 GRADE 9 TIPS:</strong><br>${fb.tips}</div>
                <div style="margin-top: 12px; font-size: 0.85rem; background: #f0f4fa; padding: 8px; border-radius: 12px;"><strong>📖 Mark scheme reference:</strong><br>${fb.markSchemeRef.substring(0, 300)}</div>
            </div>`;
        }
        reviewHtml += `<div class="weakness-box"><h3>🎯 What to do for Grade 9 (Summary)</h3><ul>
        <li>Use precise terminology: metaphor, juxtaposition, anecdote, single-story effect.</li>
        <li>Compare both texts explicitly: "Whereas Text One focuses on sport stereotypes, Text Two broadens to cultural prejudice."</li>
        <li>Transactional writing: adopt confident register, include counterargument, advanced punctuation.</li>
        <li>Always embed brief quotations to support analysis.</li>
        <li>Structure comparison answers using 'both writers... however...' + 'furthermore' for depth.</li>
        </ul><p>✅ This marking references official Edexcel IGCSE English Language A mark schemes (AO1-AO5).</p></div>`;

        // Display on screen
        const reviewDiv = document.getElementById("reviewPanel");
        reviewDiv.classList.remove("hidden");
        reviewDiv.innerHTML = reviewHtml;
        document.body.removeChild(loading);
        document.querySelectorAll("input, textarea, button").forEach((el) => {
          if (el.id !== "submitBtn") el.disabled = true;
        });
        document.getElementById("submitBtn").disabled = true;

        // Prepare email version with full styling, now includes mark scheme reference and responsive design
        const reviewHtmlForEmail = removeEmojis(reviewHtml);
        const emailHtml = buildEmailHtml(reviewHtmlForEmail);

        // ----- Email sending -----
        let recipient = DEFAULT_RECIPIENT_EMAIL;
        if (ASK_STUDENT_EMAIL) {
          let userEmail = prompt(
            "Enter your email address to receive detailed results (or cancel to download):",
            recipient,
          );
          if (userEmail && userEmail.includes("@")) recipient = userEmail;
          else {
            downloadAsHTML(emailHtml);
            showToast("No valid email provided. Results downloaded.", false);
            return;
          }
        }

        const emailSent = await sendResultsViaGoogleScript(
          recipient,
          emailHtml,
          "",
        );
        if (!emailSent) {
          downloadAsHTML(emailHtml);
        }
      }

      async function loadSavedProgress() {
        const saved = await loadProgressFromDB();
        if (
          saved &&
          saved.answers &&
          saved.answers.length === actualQuestions.length
        ) {
          if (confirm("📀 Resume previous exam progress?")) {
            for (let i = 0; i < actualQuestions.length; i++) {
              if (
                actualQuestions[i].type === "transactional" &&
                saved.transactionalState &&
                saved.transactionalState[i]
              ) {
                transactionalDataMap[i] = saved.transactionalState[i];
                userAnswers[i] = JSON.stringify(saved.transactionalState[i]);
              } else {
                userAnswers[i] = saved.answers[i] || "";
                if (
                  actualQuestions[i].type === "transactional" &&
                  saved.transactionalState &&
                  saved.transactionalState[i]
                ) {
                  transactionalDataMap[i] = saved.transactionalState[i];
                }
              }
            }
            if (saved.transactionalState)
              transactionalDataMap = saved.transactionalState;
            timeSeconds = saved.timeRemaining || timeSeconds;
            updateTimerDisplay();
            buildQuestionCards();
            renderNavigation();
          } else {
            buildQuestionCards();
            renderNavigation();
          }
        } else {
          buildQuestionCards();
          renderNavigation();
        }
      }
      // Remove emoji characters (icons) from a string
      function removeEmojis(text) {
        const emojisToRemove = [
          "📖",
          "✨",
          "🎓",
          "📝",
          "🤖",
          "🌟",
          "📌",
          "✅",
          "📘",
          "✍️",
          "📩",
          "📰",
          "⏱️",
          "🧠",
          "📂",
          "🔍",
          "◀",
          "▶",
          "📀",
          "🎯",
          "💡",
          "🔔",
          "⚠️",
          "❌",
        ];
        let result = text;
        for (const emoji of emojisToRemove) {
          result = result.split(emoji).join("");
        }
        return result;
      }

      window.onload = async () => {
        await initDatabase();
        await loadSavedProgress();
        startTimer();
        autoSaveInterval = setInterval(saveAutoProgress, 30000);
        document.getElementById("nextBtn").onclick = () => {
          if (currentQIndex + 1 < actualQuestions.length && !examSubmitted)
            goToQuestion(currentQIndex + 1);
        };
        document.getElementById("prevBtn").onclick = () => {
          if (currentQIndex - 1 >= 0 && !examSubmitted)
            goToQuestion(currentQIndex - 1);
        };
        document.getElementById("submitBtn").onclick = () => {
          submitAndMarkExam();
        };
      };
    </script>
  </body>
</html>
