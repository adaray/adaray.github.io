<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pearson Edexcel International GCSE | Reusable Exam Platform</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>   
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #1e2a3e;
        }
        .exam-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 20px 30px 40px;
        }
        .header {
            border-bottom: 3px solid #2c7da0;
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .title h1 { margin: 0; font-size: 1.7rem; color: #0b3b4f; }
        .title p { margin: 5px 0 0; color: #2c7da0; font-weight: 500; }
        .timer-area { background: #1e2a3e; padding: 8px 18px; border-radius: 60px; color: white; text-align: center; font-weight: bold; }
        .timer { font-size: 2rem; font-family: monospace; letter-spacing: 2px; }
        .info-bar {
            background: #e9f0f5;
            padding: 10px 20px;
            border-radius: 28px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .question-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 15px;
            max-height: 150px;
            overflow-y: auto;
        }
        .nav-btn {
            background: #eef2f6;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 42px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.9rem;
        }
        .nav-btn.active { background: #2c7da0; color: white; }
        .nav-btn.answered { background: #61a5c2; color: white; }
        .question-card {
            display: none;
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #e2e8f0;
        }
        .question-card.active-question { display: block; }
        .q-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            background: #f0f6fa;
            padding: 6px 12px;
            border-radius: 30px;
            display: inline-block;
        }
        .marks { font-size: 0.8rem; background: #cbd5e1; border-radius: 20px; padding: 2px 10px; margin-left: 12px; }
        .subquestion { margin: 20px 0 20px 12px; border-left: 3px solid #cbd5e1; padding-left: 18px; }
        .placeholder-img {
            background: #eef2f9;
            border: 1px dashed #8ba0bc;
            padding: 20px;
            text-align: center;
            border-radius: 16px;
            margin: 15px 0;
            font-style: italic;
            color: #2c3e66;
        }
        .mcq-option { margin: 10px 0; }
        input[type="text"], input[type="number"], textarea {
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid #b9c7d9;
            width: 100%;
            max-width: 550px;
            font-family: inherit;
        }
        textarea { max-width: 100%; }
        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 12px;
            flex-wrap: wrap;
        }
        button { background: #2c7da0; border: none; padding: 10px 26px; border-radius: 40px; color: white; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        button.secondary { background: #6c757d; }
        button.warning { background: #b23c1c; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .review-section { background: #fef9e3; padding: 20px; border-radius: 20px; margin-top: 30px; }
        .hidden { display: none; }
        .score-badge { font-size: 2rem; font-weight: bold; color: #1e2a3e; }
        .grade-box { background: #d9e6f2; padding: 12px; border-radius: 24px; margin: 15px 0; }
        .weakness-box { background: #ffe6e6; padding: 16px; border-radius: 20px; margin-top: 20px; border-left: 8px solid #c7362b; }
        .feedback-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .feedback-table th, .feedback-table td { border: 1px solid #ddd; padding: 10px; vertical-align: top; text-align: left; }
        .feedback-table th { background: #2c7da0; color: white; }
        .feedback-table tr:nth-child(even) { background: #f9f9f9; }
        .correct-highlight { background: #d4edda; }
        .incorrect-highlight { background: #f8d7da; }
        details summary { cursor: pointer; font-weight: 600; margin: 15px 0; }
        footer { text-align: center; font-size: 0.8rem; margin-top: 30px; color: #6c757d; }
        .status-toast {
            position: fixed; bottom: 20px; right: 20px;
            background: #2c7da0; color: white; padding: 8px 16px;
            border-radius: 30px; font-size: 0.8rem; opacity: 0;
            transition: opacity 0.3s; pointer-events: none; z-index: 1000;
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(3px);
        }
        .loading-spinner {
            background: white;
            padding: 30px 40px;
            border-radius: 30px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .spinner {
            border: 4px solid #e9f0f5;
            border-top: 4px solid #2c7da0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 700px) { .exam-container { padding: 15px; } .timer { font-size: 1.4rem; } .feedback-table { font-size: 0.8rem; } }
        .ai-badge { background: #4a6fa5; color: white; font-size: 0.7rem; border-radius: 20px; padding: 2px 10px; margin-left: 10px; vertical-align: middle; }
        .graph-badge { background: #f4a261; color: white; font-size: 0.7rem; border-radius: 20px; padding: 2px 10px; margin-left: 10px; vertical-align: middle; }
        .ms-panel { background: #f8f9fc; border-left: 5px solid #f4a261; padding: 12px 16px; margin-top: 15px; border-radius: 16px; font-size: 0.9rem; display: none; }
        .ms-panel.visible { display: block; }
        .marks-earned-row { margin-top: 12px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .marks-earned-row select { padding: 6px 12px; border-radius: 30px; background: white; border: 1px solid #b9c7d9; font-weight: bold; }
        button.small { background: #e76f51; padding: 5px 12px; font-size: 0.7rem; border: none; border-radius: 30px; color: white; cursor: pointer; }
    </style>
</head>
<body>
<div class="exam-container" id="examApp">

<script>
    // ========================  EXAM DATA - EDIT ONLY THIS ARRAY TO CHANGE THE ENTIRE EXAM ========================
    const questionsData = [
        // ---------- META (exam metadata) ----------
        {
            _examMeta: {
                title: "Pearson Edexcel International GCSE Biology (4BI1) Paper 2B",
                subtitle: "Biology Paper 2B",
                dateInfo: "June 2019",
                durationSeconds: 4500,      // 75 minutes
                defaultTotalMarksText: "Total marks: 70",
            }
        },
        // ---------- QUESTION 1: Ecosystem & Great Barrier Reef (Paper 2B June 2019) ----------
        { id: "q1a", type: "written", text: "1(a) What is meant by the term 'ecosystem' (line 3)?", marks: 2, topic: "Ecology / Definitions", msText: "(all) living organisms / community / (different / all) species (1) and environment / area / habitat / abiotic factors / non-living factors / physical factors (1). Ignore animals and plants for MP1.", correctKeywords: ["living organisms", "community", "species", "environment", "area", "habitat", "abiotic", "non-living", "physical factors"] },
        { id: "q1b", type: "written", text: "1(b) Suggest how the mutualistic relationship between the small animals and the algae inside them is of benefit to both species (lines 6-7).", marks: 2, topic: "Ecology / Symbiosis", msText: "(animals get) glucose / oxygen / energy (1); (algae get) carbon dioxide / protection / shelter / safety / cannot be eaten (1). Ignore 'place to live' / 'food' for second.", correctKeywords: ["glucose", "oxygen", "energy", "carbon dioxide", "protection", "shelter", "safety", "cannot be eaten"] },
        { id: "q1ci", type: "written", text: "1(c)(i) Explain why coral grows best in shallow, clear water (lines 3-4).", marks: 2, topic: "Photosynthesis / Ecology", msText: "(sun)light (1); photosynthesis (1).", correctKeywords: ["sunlight", "light", "photosynthesis"] },
        { id: "q1cii", type: "written", text: "1(c)(ii) Suggest why coral grows best in moving water (lines 3-4).", marks: 2, topic: "Ecology / Gas exchange", msText: "supply food / algae / plankton (1); supply minerals / ions / named mineral (1); supply oxygen (1); supply carbon dioxide (1); remove waste / faeces / carbon dioxide (1); distribute gametes (1).", correctKeywords: ["supply food", "algae", "plankton", "minerals", "ions", "oxygen", "carbon dioxide", "remove waste", "distribute gametes"] },
        { id: "q1d", type: "written", text: "1(d) Suggest how scientists are able to find the percentage of coral that has died in a section of the reef.", marks: 3, topic: "Practical / Sampling", msText: "quadrat (1); repeat (1); random / random number (1); count / measure / number of / percentage cover of coral (1); calculate percentage by dead ÷ total × 100 / dead ÷ living+dead ×100 (1).", correctKeywords: ["quadrat", "repeat", "random", "count", "percentage cover", "dead/total ×100"] },
        { id: "q1e", type: "written", text: "1(e) Give one reason why coral that survives higher sea temperatures is under increased threat from predators (lines 22-24).", marks: 1, topic: "Ecology / Predation", msText: "there is less food / less coral to eat (1). Ignore 'only source of food'.", correctKeywords: ["less food", "less coral to eat"] },
        { id: "q1f", type: "written", text: "1(f) Suggest what recommendations should be included in the sustainability plan for the coral reef (lines 26-27).", marks: 3, topic: "Conservation", msText: "reduce greenhouse gas / greenhouse effect (1); reduce CO₂/CFCs/methane/N₂O/ozone emissions (1); use less fossil fuel / renewable energy / less deforestation / cycling (1); control/reduce predators / starfish / snails (1); reduce tourism / fishing / restrict access (1); reintroduce coral / plant more coral / grow coral in lab (1).", correctKeywords: ["reduce greenhouse gas", "carbon dioxide", "renewable energy", "less fossil fuel", "control predators", "reduce tourism", "reintroduce coral"] },
        
        // Question 2: Leaf starch test, mesophyll, transpiration evaluation
        { id: "q2a", type: "written", text: "2(a) Describe how you would test a leaf to show that it contains starch.", marks: 3, topic: "Plant biology / Testing", msText: "use warm/hot ethanol/alcohol / use ethanol in water bath (1); use iodine (1); blue black / blue / black (1).", correctKeywords: ["ethanol", "alcohol", "water bath", "iodine", "blue-black", "blue", "black"] },
        { id: "q2b", type: "written", text: "2(b) Explain the differences between the palisade mesophyll and the spongy mesophyll (refer to diagram).", marks: 4, topic: "Leaf structure", msText: "palisade at top/just beneath upper epidermis OR spongy in middle/near lower surface (1); palisade closely packed / no air spaces OR spongy have air spaces (1); palisade have more/many chloroplasts OR spongy have fewer (1); palisade absorb (sun)light (1); spongy allow diffusion/gas exchange/transpiration (1).", correctKeywords: ["palisade top", "spongy middle", "closely packed", "air spaces", "more chloroplasts", "absorb light", "gas exchange", "diffusion"] },
        { id: "q2c", type: "written", text: "2(c) Evaluate the student's conclusion that transpiration occurs mainly from the upper surface of leaves, using the petroleum jelly experiment results (graph provided).", marks: 3, topic: "Transpiration / Evaluation", msText: "mass is lost from lower surface / mass lost when upper surface covered OR little/least mass lost from upper surface (1); stomata in lower surface / few/no stomata on upper surface (1); disagrees with conclusion (1).", correctKeywords: ["mass lost lower surface", "stomata lower surface", "disagrees with conclusion", "little mass lost upper surface"] },

        // Question 3: Fungi, amylase, protein synthesis, decomposition & pH
        { id: "q3ai", type: "mcq", text: "3(a)(i) Which of these is a feature of fungi?", options: ["A chloroplasts in the cytoplasm", "B starch stored in the cytoplasm", "C thread-like hyphae", "D walls made of cellulose"], correct: "C", marks: 1, topic: "Fungi", msText: "C thread-like hyphae" },
        { id: "q3aii", type: "mcq", text: "3(a)(ii) The soil fungi release amylase. What is the product of this digestion?", options: ["A amino acids", "B fatty acids", "C glycerol", "D maltose"], correct: "D", marks: 1, topic: "Enzymes", msText: "D maltose" },
        { id: "q3aiii", type: "written", text: "3(a)(iii) Amylase is a protein. Describe how protein is made in a cell.", marks: 5, topic: "Protein synthesis", msText: "transcription / transcripts (1); mRNA leaves nucleus and enters cytoplasm (1); ribosomes (1); tRNA (brings) attached amino acids (1); codons / anticodons / complementary bases (1); translation / amino acid chain / polypeptide chain (1).", correctKeywords: ["transcription", "mRNA", "ribosomes", "tRNA", "codons", "anticodons", "translation", "polypeptide"] },
        { id: "q3bi", type: "calc", text: "3(b)(i) Calculate the percentage loss in mass shown by the square in pH 9.0 soil. (Mass start: 2.10g, after 10 days: 0.62g)", marks: 1, topic: "Maths / Calculation", correctValue: 70.5, tolerance: 0.5, msText: "((2.10-0.62)/2.10)×100 = 70.5% (1)." },
        { id: "q3bii", type: "calc", text: "3(b)(ii) Calculate the difference between the percentage loss in mass for the two squares (pH7: 50% loss, pH9: answer from 3(b)(i)).", marks: 1, topic: "Maths", correctValue: 20.5, tolerance: 0.5, msText: "(70.5 – 50 =) 20.5 (1)." },
        { id: "q3biii", type: "written", text: "3(b)(iii) Explain how the student could improve her method to obtain more accurate results.", marks: 4, topic: "Practical / Accuracy", msText: "same surface area / mass / thickness / area / size (1); remove soil from square before weighing (1); control temperature / oxygen / moisture (1); same mass/amount/type of soil / decomposers (1); repeat / use more squares / average (1); increase range of pH / more pHs (1).", correctKeywords: ["same surface area", "remove soil", "control temperature", "same soil mass", "repeat", "more pH values"] },

        // Question 4: Kidney nephron, kangaroo rat adaptations
        { id: "q4ai", type: "mcq", text: "4(a)(i) Where does ultrafiltration take place in the nephron?", options: ["A Glomerulus", "B Proximal convoluted tubule", "C Loop of Henle", "D Collecting duct"], correct: "A", marks: 1, topic: "Kidney", msText: "A Glomerulus" },
        { id: "q4aii", type: "mcq", text: "4(a)(ii) Where does reabsorption of glucose take place?", options: ["A Glomerulus", "B Proximal convoluted tubule", "C Loop of Henle", "D Collecting duct"], correct: "B", marks: 1, topic: "Kidney", msText: "B Proximal convoluted tubule" },
        { id: "q4aiii", type: "mcq", text: "4(a)(iii) Which part responds to a change in ADH?", options: ["A Proximal convoluted tubule", "B Ultrafiltration site", "C Loop of Henle", "D Collecting duct"], correct: "D", marks: 1, topic: "Kidney", msText: "D Collecting duct" },
        { id: "q4bi", type: "written", text: "4(b)(i) In kangaroo rats, tissue surrounding collecting duct has high ion concentration. Explain how this enables survival in desert.", marks: 3, topic: "Osmoregulation", msText: "water reabsorbed / water into blood (1); osmosis (1); concentrated urine / less water in urine / less urine (1).", correctKeywords: ["water reabsorbed", "osmosis", "concentrated urine", "less water in urine"] },
        { id: "q4bii", type: "written", text: "4(b)(ii) Kangaroo rats stay underground during day and feed at night. Explain how this behaviour enables survival.", marks: 2, topic: "Behavioural adaptation", msText: "hot/higher temperature during day / cooler at night underground (1); less water loss / less dehydration (1); hide from predators (1).", correctKeywords: ["hot during day", "cooler underground", "less water loss", "hide from predators"] },
        { id: "q4biii", type: "written", text: "4(b)(iii) Kangaroo rats rarely drink water. Suggest where they get their water from.", marks: 1, topic: "Physiology", msText: "respiration (1); food / cacti / plants / seeds (1); condensation (1).", correctKeywords: ["respiration", "food", "cacti", "seeds", "condensation"] },
        
        // Question 5: Sex chromosomes, birds, hormones
        { id: "q5a", type: "written", text: "5(a) Give the sex chromosomes in the body cell of a human male.", marks: 1, topic: "Genetics", msText: "XY / X and Y / YX", correctKeywords: ["XY", "X and Y"] },
        { id: "q5bi", type: "mcq", text: "5(b)(i) What are the sex chromosomes in the body cell of a male bird?", options: ["A XY", "B ZW", "C ZY", "D ZZ"], correct: "D", marks: 1, topic: "Genetics", msText: "D ZZ" },
        { id: "q5bii", type: "calc", text: "5(b)(ii) A male and female bird have four offspring. Calculate the probability that these offspring will all be female.", marks: 2, topic: "Probability", correctValue: 0.0625, tolerance: 0.0001, msText: "probability of one female = 0.5; (0.5)^4 = 0.0625 / 1/16 (2)." },
        { id: "q5ci", type: "written", text: "5(c)(i) Complete the hormone table: FSH source? LH function? Oestrogen source? Progesterone function?", marks: 4, topic: "Menstrual cycle", msText: "FSH: pituitary (1); LH: ovulation/egg release (1); oestrogen: ovary/corpus luteum/placenta (1); progesterone: maintains uterus lining / inhibits FSH/LH (1).", correctKeywords: ["pituitary", "ovulation", "ovary", "maintains uterus lining"] },
        { id: "q5cii", type: "written", text: "5(c)(ii) From hormone level chart, assign letters P,Q,R,S to FSH, LH, oestrogen, progesterone.", marks: 3, topic: "Data interpretation", msText: "FSH = Q, LH = R, oestrogen = P, progesterone = S (3).", correctKeywords: ["FSH=Q", "LH=R", "oestrogen=P", "progesterone=S"] },

        // Question 6: Alveoli model (cubes) and adaptations
        { id: "q6ai", type: "calc", text: "6(a)(i) Complete table: total surface area of small cubes (side 1cm) if total volume = 8000 cm³. (large cube side 20cm, SA large cube = 2400 cm²). Number of small cubes = 8000. SA of one small cube = 6 cm². Total SA = ?", marks: 2, topic: "Maths / Model", correctValue: 48000, tolerance: 0, msText: "48000 (1) for calculation; (8000 × 6 = 48000) (1)." },
        { id: "q6aii", type: "calc", text: "6(a)(ii) Calculate ratio of total surface area of small cubes to surface area of large cube.", marks: 1, topic: "Maths", correctValue: 20, tolerance: 0, msText: "48000 : 2400 = 20:1 (1)." },
        { id: "q6b", type: "written", text: "6(b) Evaluate the student's model as a representation of the lungs.", marks: 2, topic: "Evaluation / Modelling", msText: "reference to many cubes / many alveoli / SA:Vol (1); alveoli are not cubes / round/spherical / different shape (1); alveoli surfaces touch / not all surfaces exposed (1); reference to bronchioles (1).", correctKeywords: ["many alveoli", "SA:Vol", "not cubes", "spherical", "surfaces touch"] },
        { id: "q6c", type: "written", text: "6(c) Explain three other ways that alveoli are adapted to maximise gas exchange.", marks: 3, topic: "Gas exchange", msText: "thin walls / one cell thick / short diffusion distance (1); wet / moist and gases dissolve (1); capillaries / blood supply maintain concentration gradient (1).", correctKeywords: ["thin walls", "short diffusion distance", "moist", "capillaries", "concentration gradient"] },
        
        // Question 7: Micropropagation
        { id: "q7ai", type: "written", text: "7(a)(i) Give a method that could be used to sterilise the explants in stage 2.", marks: 1, topic: "Plant biotechnology", msText: "bleach/hypochlorite/disinfectant/antiseptic/chlorine (1); alcohol/ethanol (1); radiation/UV/gamma rays (1).", correctKeywords: ["bleach", "hypochlorite", "alcohol", "radiation", "UV"] },
        { id: "q7aii", type: "written", text: "7(a)(ii) Give the name of one nutrient that should be added to the agar plate in stage 3.", marks: 1, topic: "Micropropagation", msText: "nitrate / ammonium / magnesium / calcium / sulphate / potassium / phosphate / iron (1); amino acids (1); sucrose / glucose / sugar / starch (1).", correctKeywords: ["nitrate", "magnesium", "sucrose", "glucose", "amino acids"] }
    ];
    // ======================== END OF QUESTIONS DATA ========================
    
    // Extract exam metadata
    let examMeta = null;
    let pureQuestions = [];
    for (let item of questionsData) {
        if (item._examMeta) examMeta = item._examMeta;
        else pureQuestions.push(item);
    }
    if (!examMeta) examMeta = { title: "Edexcel IGCSE Exam", subtitle: "", dateInfo: "", durationSeconds: 5400, defaultTotalMarksText: "Total marks: --" };
    
    const TOTAL_MARKS = pureQuestions.reduce((sum, q) => sum + (q.marks || 0), 0);
    document.getElementById("examTitle").innerText = examMeta.title;
    document.getElementById("examSubtitle").innerHTML = examMeta.subtitle || "";
    document.getElementById("examDateBadge").innerHTML = `📅 ${examMeta.dateInfo || ""}`;
    document.getElementById("totalMarksLabel").innerHTML = `📖 ${examMeta.defaultTotalMarksText || `Total marks: ${TOTAL_MARKS}`}`;
    let timeSeconds = examMeta.durationSeconds || 4500;
    
    // Deepseek API configuration (preserved from original)
    const DEEPSEEK_API_KEY = "DEEPSEEK_API_KEY_PLACEHOLDER";  // Replace with actual key for AI marking
    const DEEPSEEK_MODEL = "deepseek-chat";
    
    // Helper: detect graph/practical questions for self-assessment
    function isGraphOrPractical(q) {
        return q.type === 'graph' || q.type === 'draw' || q.type === 'practical' || q.type === 'diagram';
    }
    const enhancedQuestions = pureQuestions.map(q => ({ ...q, isGraphical: isGraphOrPractical(q) }));
    const graphCount = enhancedQuestions.filter(q => q.isGraphical).length;
    
    // State
    let userAnswers = new Array(enhancedQuestions.length).fill("");
    let userManualMarks = new Array(enhancedQuestions.length).fill(null);
    let currentQIndex = 0;
    let examSubmitted = false;
    let timerInterval;
    let autoSaveTimer = null;
    
    // EmailJS config (unchanged)
    const EMAILJS_PUBLIC_KEY = "PmVcThAzwAjgqOwSD";
    const EMAILJS_SERVICE_ID = "service_301bogs";
    const EMAILJS_TEMPLATE_ID = "template_mld7q9t";
    const RECIPIENT_EMAIL = "aisha.daray@gmail.com";
    if(EMAILJS_PUBLIC_KEY && EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {
        try { emailjs.init(EMAILJS_PUBLIC_KEY); } catch(e) {}
    }
    
    // Auto-save & timer functions
    function autoSaveToLocal() {
        if(examSubmitted) return;
        localStorage.setItem("igcse_exam_autosave", JSON.stringify({ answers: userAnswers, manualMarks: userManualMarks, timeRemaining: timeSeconds, timestamp: Date.now() }));
    }
    function loadAutoSave() {
        const saved = localStorage.getItem("igcse_exam_autosave");
        if(saved) {
            try {
                const data = JSON.parse(saved);
                if(data.answers && data.answers.length === userAnswers.length) {
                    userAnswers = data.answers;
                    if(data.manualMarks) userManualMarks = data.manualMarks;
                    if(data.timeRemaining && data.timeRemaining > 0 && data.timeRemaining < 7200) timeSeconds = data.timeRemaining;
                }
            } catch(e) {}
        }
    }
    function formatTime(sec) { let h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    function updateTimerDisplay() { document.getElementById("timerDisplay").innerText = formatTime(timeSeconds); if(timeSeconds<=0 && !examSubmitted) submitAndMarkExam(); }
    function startTimer() { timerInterval = setInterval(()=>{ if(!examSubmitted && timeSeconds>0){ timeSeconds--; updateTimerDisplay(); if(timeSeconds%30===0) autoSaveToLocal(); } else if(timeSeconds<=0 && !examSubmitted) submitAndMarkExam(); }, 1000); }
    
    function renderNavigation() {
        const navDiv = document.getElementById("navContainer");
        navDiv.innerHTML = "";
        enhancedQuestions.forEach((_, idx) => {
            const btn = document.createElement("button");
            btn.innerText = idx+1;
            btn.classList.add("nav-btn");
            if(userAnswers[idx] && userAnswers[idx].toString().trim() !== "") btn.classList.add("answered");
            if(idx === currentQIndex) btn.classList.add("active");
            btn.onclick = () => { if(!examSubmitted) goToQuestion(idx); };
            navDiv.appendChild(btn);
        });
        let answered = userAnswers.filter(a => a && a.toString().trim() !== "").length;
        document.getElementById("answeredCounter").innerHTML = `📝 Questions answered: ${answered} / ${enhancedQuestions.length}`;
    }
    function goToQuestion(idx) { if(examSubmitted) return; document.querySelectorAll(".question-card").forEach(card => card.classList.remove("active-question")); currentQIndex = idx; document.getElementById(`qcard-${idx}`).classList.add("active-question"); renderNavigation(); }
    function saveAnswer(idx, value) { if(examSubmitted) return; userAnswers[idx] = value; renderNavigation(); autoSaveToLocal(); }
    function setManualMark(idx, markValue) { if(examSubmitted) return; let num = parseInt(markValue) || 0; num = Math.min(Math.max(num,0), enhancedQuestions[idx].marks); userManualMarks[idx] = num; autoSaveToLocal(); }
    function toggleMarkScheme(idx) { let panel = document.getElementById(`ms-panel-${idx}`); if(panel) panel.classList.toggle("visible"); }
    
    // Deepseek AI marking (original implementation)
    async function callDEEPSEEKForMark(question, studentAnswer, markScheme, maxMarks) {
        if(!DEEPSEEK_API_KEY || DEEPSEEK_API_KEY === "DEEPSEEK_API_KEY_PLACEHOLDER") {
            // Fallback: keyword matching
            let keywords = question.correctKeywords || [];
            if(!studentAnswer) return { score: 0, feedback: "No answer provided" };
            let ansLower = studentAnswer.toLowerCase();
            let matched = keywords.filter(kw => ansLower.includes(kw.toLowerCase())).length;
            let score = Math.min(matched, maxMarks);
            return { score, feedback: `Keyword match: ${matched}/${keywords.length} terms. Expected: ${keywords.slice(0,4).join(", ")}` };
        }
        const prompt = `You are an Edexcel IGCSE Biology examiner. Award marks strictly based on the mark scheme and provide constructive feedback.
Question: "${question.text}"
Mark Scheme: "${markScheme}"
Maximum marks: ${maxMarks}
Student Answer: "${studentAnswer || '[no answer]'}"
Return ONLY a JSON object: {"score": number (0-${maxMarks}), "feedback": "brief constructive feedback"}. No extra text.`;
        try {
            const response = await fetch("https://api.deepseek.com/v1/chat/completions", {
                method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${DEEPSEEK_API_KEY}` },
                body: JSON.stringify({ model: DEEPSEEK_MODEL, messages: [{ role: "user", content: prompt }], temperature: 0.1 })
            });
            if(!response.ok) throw new Error(`API error ${response.status}`);
            const data = await response.json();
            const result = JSON.parse(data.choices[0].message.content);
            return { score: Math.min(Math.max(0, parseInt(result.score) || 0), maxMarks), feedback: result.feedback || "AI assessment complete." };
        } catch(e) { console.error("Deepseek error:", e); return { score: 0, feedback: "AI marking error - review manually" }; }
    }
    
    async function submitAndMarkExam() {
        if(examSubmitted) return;
        clearInterval(timerInterval);
        examSubmitted = true;
        const loadingDiv = document.createElement("div"); loadingDiv.className = "loading-overlay";
        loadingDiv.innerHTML = `<div class="loading-spinner"><div class="spinner"></div><p>AI Marking in progress...</div>`;
        document.body.appendChild(loadingDiv);
        let totalEarned = 0, totalPossible = 0;
        let questionFeedback = [];
        for(let i=0; i<enhancedQuestions.length; i++) {
            let q = enhancedQuestions[i];
            let answer = userAnswers[i] || "";
            let earned = 0, aiFeedback = "";
            if(q.isGraphical) {
                earned = (userManualMarks[i] !== null && !isNaN(userManualMarks[i])) ? userManualMarks[i] : 0;
                earned = Math.min(earned, q.marks);
                aiFeedback = "Self-assessed using mark scheme (graph/diagram question).";
            } else if (q.type === "mcq") {
                let ansLetter = (answer || "").trim().toUpperCase().charAt(0);
                let correctLetter = (q.correct || "").trim().toUpperCase();
                if(ansLetter === correctLetter) { earned = q.marks; aiFeedback = `Correct answer: ${q.correct}`; }
                else { earned = 0; aiFeedback = `Incorrect. Correct answer: ${q.correct}`; }
            } else if (q.type === "calc") {
                let num = parseFloat(answer);
                if(isNaN(num)) { earned = 0; aiFeedback = "Numeric answer required."; }
                else { let target = q.correctValue, tol = q.tolerance || 0; if(Math.abs(num - target) <= tol) { earned = q.marks; aiFeedback = "Correct calculation."; } else { earned = 0; aiFeedback = `Incorrect. Expected ≈ ${target}`; } }
            } else {
                const aiRes = await callDEEPSEEKForMark(q, answer, q.msText, q.marks);
                earned = aiRes.score;
                aiFeedback = aiRes.feedback;
            }
            totalEarned += earned;
            totalPossible += q.marks;
            questionFeedback.push({ number: i+1, topic: q.topic, question: q.text, studentAnswer: answer || "(blank)", marksEarned: earned, marksTotal: q.marks, status: earned===q.marks?"✓ Full":earned===0?"✗ No":"⚠ Partial", expectedAnswer: q.msText, aiFeedback, isGraphical: q.isGraphical });
        }
        let percent = (totalEarned / totalPossible) * 100;
        let grade = percent >=85 ? "9" : percent>=78 ? "8" : percent>=70 ? "7" : percent>=62 ? "6" : percent>=54 ? "5" : percent>=45 ? "4" : percent>=35 ? "3" : percent>=25 ? "2" : "1";
        let weakTopics = [];
        let topicAgg = {};
        questionFeedback.forEach(fb => { if(!topicAgg[fb.topic]) topicAgg[fb.topic]={earned:0,total:0}; topicAgg[fb.topic].earned+=fb.marksEarned; topicAgg[fb.topic].total+=fb.marksTotal; });
        for(let t in topicAgg) if((topicAgg[t].earned/topicAgg[t].total)*100 < 55) weakTopics.push(t);
        const reviewDiv = document.getElementById("reviewPanel");
        reviewDiv.classList.remove("hidden");
        let html = `<h2>📊 Exam Results</h2><div class="score-badge">${totalEarned} / ${totalPossible} (${percent.toFixed(1)}%)</div><div class="grade-box"><strong>Edexcel Grade: ${grade}</strong></div><div class="grade-box" style="background:#e9f0f5;">📊 Graph questions (self-assessed): ${graphCount}</div>`;
        if(weakTopics.length) html += `<div class="weakness-box"><h3>⚠️ Weak areas (&lt;55%)</h3><ul>${weakTopics.map(w=>`<li>${w}</li>`).join('')}</ul></div>`;
        else html += `<div class="weakness-box" style="background:#e0f2e9;"><h3>✅ Strong performance overall!</h3></div>`;
        html += `<details open><summary>📋 Detailed Feedback</summary><table class="feedback-table"><thead><tr><th>#</th><th>Topic</th><th>Your Answer</th><th>Score</th><th>Feedback</th><th>Mark Scheme</th></tr></thead><tbody>`;
        for(let fb of questionFeedback) {
            let cls = fb.marksEarned === fb.marksTotal ? "correct-highlight" : (fb.marksEarned===0 ? "incorrect-highlight" : "");
            html += `<tr class="${cls}"><td>${fb.number}${fb.isGraphical?' 📊':''}</td><td>${fb.topic}</td><td style="max-width:250px;">${fb.studentAnswer}</td><td style="text-align:center;">${fb.marksEarned}/${fb.marksTotal}<br>${fb.status}</td><td>${fb.aiFeedback}</td><td style="max-width:250px;">${fb.expectedAnswer || "N/A"}</td></tr>`;
        }
        html += `</tbody></table></details><p>✅ Non-graphical questions marked by Deepseek AI (or fallback). Graph/diagram questions require self-assessment using mark scheme.</p>`;
        reviewDiv.innerHTML = html;
        document.body.removeChild(loadingDiv);
        document.querySelectorAll("input, textarea, button, select").forEach(el => { if(el.id !== "submitBtn") el.disabled = true; });
        document.getElementById("submitBtn").disabled = true;
        localStorage.removeItem("igcse_exam_autosave");
    }
    
    function buildQuestionsHTML() {
        const container = document.getElementById("questionsContainer");
        container.innerHTML = "";
        enhancedQuestions.forEach((q, idx) => {
            const card = document.createElement("div");
            card.className = "question-card";
            if(idx === 0) card.classList.add("active-question");
            card.id = `qcard-${idx}`;
            let inner = `<div class="q-title">Q${idx+1} (${q.topic}) <span class="marks">${q.marks} marks</span>`;
            if(q.isGraphical) inner += `<span class="graph-badge">📊 Graph/Diagram - Self-Assess</span>`;
            inner += `</div><div>${q.text}</div>`;
            if(q.type === "mcq") {
                inner += `<div class="subquestion">`;
                (q.options || []).forEach(opt => { let checked = (userAnswers[idx] === opt) ? "checked" : ""; inner += `<label class="mcq-option"><input type="radio" name="q${idx}" value="${opt}" ${checked} onchange="saveAnswer(${idx}, this.value)"> ${opt}</label><br>`; });
                inner += `</div>`;
            } else if(q.type === "calc") {
                let val = userAnswers[idx] || "";
                inner += `<div class="subquestion"><input type="text" placeholder="Numeric answer..." value="${val.replace(/"/g, '&quot;')}" onchange="saveAnswer(${idx}, this.value)"></div>`;
            } else {
                let val = userAnswers[idx] || "";
                inner += `<div class="subquestion"><textarea rows="3" placeholder="Write your answer..." oninput="saveAnswer(${idx}, this.value)">${val}</textarea></div>`;
            }
            if(q.isGraphical) {
                inner += `<div style="margin-top:12px;"><button type="button" class="small" onclick="toggleMarkScheme(${idx})">📖 Show Mark Scheme (self-assess)</button>
                          <div id="ms-panel-${idx}" class="ms-panel"><strong>📌 Mark Scheme:</strong><br>${q.msText || 'No mark scheme'}</div>
                          <div class="marks-earned-row"><span>✍️ Self-assess marks earned (0-${q.marks}): </span>
                          <select onchange="setManualMark(${idx}, this.value)"><option value="">-- select --</option>`;
                for(let m=0; m<=q.marks; m++) { let sel = (userManualMarks[idx] === m) ? "selected" : ""; inner += `<option value="${m}" ${sel}>${m} / ${q.marks}</option>`; }
                inner += `</select></div></div>`;
            }
            if(q.text.toLowerCase().includes('graph') || q.text.toLowerCase().includes('plot') || q.isGraphical) inner += `<div class="placeholder-img">📈 [Graph/Diagram placeholder – draw on paper or upload]</div>`;
            card.innerHTML = inner;
            container.appendChild(card);
        });
    }
    
    window.saveAnswer = saveAnswer; window.setManualMark = setManualMark; window.toggleMarkScheme = toggleMarkScheme; window.goToQuestion = goToQuestion;
    window.onload = () => {
        loadAutoSave();
        buildQuestionsHTML();
        renderNavigation();
        startTimer();
        autoSaveTimer = setInterval(() => { if(!examSubmitted) autoSaveToLocal(); }, 30000);
        document.getElementById("nextBtn").onclick = () => { if(currentQIndex+1 < enhancedQuestions.length && !examSubmitted) goToQuestion(currentQIndex+1); };
        document.getElementById("prevBtn").onclick = () => { if(currentQIndex-1 >=0 && !examSubmitted) goToQuestion(currentQIndex-1); };
        document.getElementById("submitBtn").onclick = () => { if(confirm("Submit exam? Graph questions require self-assessment; others will be AI-marked.")) submitAndMarkExam(); };
    };
</script>
</body>
