      async function callDEEPSEEKForMark(
        question,
        studentAnswer,
        markScheme,
        maxMarks,
      ) {
        if (!DEEPSEEK_API_KEY || DEEPSEEK_API_KEY === "YOUR_DEEPSEEK_API_KEY") {
          if (!studentAnswer)
            return { score: 0, feedback: "No answer provided" };
          let keywords = question.correctKeywords || [];
          if (keywords.length === 0)
            return { score: 0, feedback: "No keywords defined" };
          let ansLower = studentAnswer.toLowerCase();
          let matched = keywords.filter((kw) =>
            ansLower.includes(kw.toLowerCase()),
          ).length;
          let required = question.requiredKeywords || keywords.length;
          let score = Math.min(matched, required, maxMarks);
          return {
            score,
            feedback: `Matched ${matched}/${required} key terms. Expected: ${keywords.join(", ")}`,
          };
        }
        const prompt = `You are an Edexcel IGCSE Biology examiner. Award marks strictly based on mark scheme. Question: "${question.text}" Mark Scheme: "${markScheme}" Max marks: ${maxMarks} Student Answer: "${studentAnswer || "[no answer]"}" Return ONLY JSON: {"score": number (0-${maxMarks}), "feedback": "brief feedback"}`;
        try {
          const response = await fetch(
            "https://api.DEEPSEEK.com/v1/chat/completions",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${DEEPSEEK_API_KEY}`,
              },
              body: JSON.stringify({
                model: DEEPSEEK_MODEL,
                messages: [{ role: "user", content: prompt }],
                temperature: 0.1,
              }),
            },
          );
          if (!response.ok) throw new Error(`API error ${response.status}`);
          const data = await response.json();
          const result = JSON.parse(data.choices[0].message.content);
          return {
            score: Math.min(Math.max(0, parseInt(result.score) || 0), maxMarks),
            feedback: result.feedback || "Smart assessment complete.",
          };
        } catch (e) {
          console.error("DEEPSEEK error:", e);
          return {
            score: 0,
            feedback: "Smart marking error - please review manually",
          };
        }
      }

          } else if (q.type === "mcq") {

            aiFeedback =

            status,
            expectedAnswer: q.msText,
            aiFeedback,
            isGraphical: q.isGraphical,
          });
        }
        let percent = (totalEarned / totalPossible) * 100;

        if (weakTopics.length)

        else

        html += `<details open><summary>📋 Detailed Feedback</summary><table class="feedback-table"><thead><tr><th>#</th><th>Topic</th><th>Question</th><th>Your Answer</th><th>Score</th><th>Feedback</th><th>Mark Scheme</th></tr></thead><tbody>`;
        for (let fb of questionFeedback) {
          let cls =
            fb.marksEarned === fb.marksTotal
              ? "correct-highlight"
              : fb.marksEarned === 0
                ? "incorrect-highlight"
                : "";
          html += `<tr class="${cls}"><td>${fb.number}${fb.isGraphical ? " 📊" : ""}</td><td>${fb.topic}</td><td>${fb.questionText}</td><td style="max-width:250px;">${fb.studentAnswer}</td><td style="text-align:center;">${fb.marksEarned}/${fb.marksTotal}<br>${fb.status}</td><td style="max-width:300px;">${fb.aiFeedback || "No feedback"}</td><td style="max-width:250px;">${fb.expectedAnswer || "N/A"}</td></tr>`;
        }
        html += `</tbody></table></details><p style="margin-top: 20px; padding: 12px; background: #f0f6fa; border-radius: 16px;">✅ <strong>How marking worked:</strong> Graph/drawing questions (${graphQuestionCount}) were self-assessed. All others marked automatically.</p>`;
        reviewDiv.innerHTML = html;
        document.body.removeChild(loadingDiv);
        document
          .querySelectorAll("input, textarea, button, select")
          .forEach((el) => {
            if (el.id !== "submitBtn") el.disabled = true;
          });
        document.getElementById("submitBtn").disabled = true;
        showToast("Marking complete!", false);
        localStorage.removeItem("igcse_bio_exam_autosave");
        try {
          const emailData = {
            score: totalEarned,
            totalMarks: totalPossible,
            percent,
            grade,
            weakTopics,
            details: questionFeedback.map((fb) => ({
              qNum: fb.number,
              topic: fb.topic,
              questionText: fb.questionText,
              studentAnswer: fb.studentAnswer,
              earned: fb.marksEarned,
              max: fb.marksTotal,
              aiFeedback: fb.aiFeedback,
              expectedAnswer: fb.expectedAnswer,
              isGraphical: fb.isGraphical,
            })),
          };
          await sendResultsEmail(emailData, "Exam Candidate");
        } catch (e) {
          console.error("Email sending failed:", e);
        }
      }

      window.saveAnswer = saveAnswer;
      window.setManualMark = setManualMark;
      window.toggleMarkScheme = toggleMarkScheme;
      window.goToQuestion = goToQuestion;
      window.handleTextareaInput = handleTextareaInput;

      window.onload = () => {
        loadAutoSave();
        buildQuestionsHTML();
        renderNavigation();
        startTimer();
        autoSaveTimer = setInterval(() => {
          if (!examSubmitted) autoSaveToLocal();
        }, 30000);
        document.getElementById("nextBtn").onclick = () => {
          if (currentQIndex + 1 < questionsData.length && !examSubmitted)
            goToQuestion(currentQIndex + 1);
        };
        document.getElementById("prevBtn").onclick = () => {
          if (currentQIndex - 1 >= 0 && !examSubmitted)
            goToQuestion(currentQIndex - 1);
        };
        document.getElementById("submitBtn").onclick = () => {
          if (
            confirm(
              "Submit exam? Graph questions require self-assessment; other questions will be Smart-marked.",
            )
          )
            submitAndMarkExam();
        };
      };
    </script>
  </body>
</html>
