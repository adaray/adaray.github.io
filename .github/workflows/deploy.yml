name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Create API key JS file (root)
        run: |
          echo "// Auto-generated API key - DO NOT COMMIT" > ./apikey.js
          echo "const API_KEY = '${{ secrets.DEEPSEEK_API_KEY }}';" >> ./apikey.js
          echo "✅ apikey.js created at root"
      
      - name: Replace placeholder in HTML files (fallback)
        run: |
          # Find all HTML files recursively
          HTML_FILES=$(find . -name "*.html" -type f)
          
          if [ -z "$HTML_FILES" ]; then
            echo "⚠️ No HTML files found, skipping inline replacement."
          else
            for file in $HTML_FILES; do
              sed -i "s/DEEPSEEK_API_KEY_PLACEHOLDER/${{ secrets.DEEPSEEK_API_KEY }}/g" "$file"
              echo "Processed: $file"
            done
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
